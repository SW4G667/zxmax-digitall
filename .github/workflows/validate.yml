name: Validate application

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/zxmax-marketplace-hardening-20260928

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --runInBand
      - name: Build
        run: npm run build
