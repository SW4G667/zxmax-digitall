name: Deploy Supabase (Edge Functions)

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Aplicar também as migrações do banco (supabase db push)?"
        type: boolean
        default: false

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN não configurado."
            exit 1
          fi
          for fn in admin-login admin-verify check-evopay-status create-evopay-pix create-purchase create-stripe-checkout create-vexopay-crypto discord-callback evopay-webhook evopay-withdraw integrations-config mark-order-delivered order-action public-products send-email; do
            echo "==> Deploy $fn"
            supabase functions deploy "$fn" --project-ref dbekdedzgkfgtlytrnyw
          done

  apply-migrations:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply_migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref dbekdedzgkfgtlytrnyw

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --project-ref dbekdedzgkfgtlytrnyw
