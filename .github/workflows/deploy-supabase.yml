name: Deploy Supabase (ZXMAX)

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Aplicar também as migrações do banco?"
        type: boolean
        default: false

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy managed Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::SUPABASE_ACCESS_TOKEN não configurado."; exit 1; }
          PROJECT_REF="szvkktvubyhulzipcxfk"
          for fn in create-purchase integrations-config create-magnuspay-pix site-config; do
            echo "==> Deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done

  apply-migrations:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply_migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase link --project-ref szvkktvubyhulzipcxfk
          supabase db push
