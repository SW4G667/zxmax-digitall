name: VOLT Android APK Build

on:
  push:
    branches:
      - feat/**

jobs:
  build-voltapk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout staged source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore corrected VOLT v0.3 source
        shell: bash
        run: |
          set -euxo pipefail
          cat volt-build-chunks/part_*.b64 > /tmp/volt.tar.gz.b64
          base64 -d /tmp/volt.tar.gz.b64 > /tmp/volt.tar.gz
          mkdir -p /tmp/volt-src
          tar -xzf /tmp/volt.tar.gz -C /tmp/volt-src
          ROOT=/tmp/volt-src/VOLT-Game-Space
          test -f "$ROOT/app/build.gradle.kts"
          sed -i 's/androidx.compose:compose-bom:2026.09.00/androidx.compose:compose-bom:2025.08.00/' "$ROOT/app/build.gradle.kts"

          cat > "$ROOT/app/src/main/java/com/volt/gamespace/core/FpsProbe.kt" <<'KOTLIN'
          package com.volt.gamespace.core

          import com.volt.gamespace.shizuku.ShizukuBridge

          data class FpsSample(val fps: Double?, val source: String)

          class FpsProbe(private val shizuku: ShizukuBridge) {
              fun sample(packageName: String): FpsSample {
                  if (!shizuku.hasPermission()) return FpsSample(null, "Shizuku não autorizado")

                  val safe = packageName.replace("'", "")
                  val layer = shizuku.exec(
                      "sh", "-c",
                      "dumpsys SurfaceFlinger --list 2>/dev/null | grep -F '$safe' | head -n 1"
                  )?.trim().orEmpty()

                  if (layer.isBlank() || layer.startsWith("ERROR:")) {
                      return FpsSample(null, "Surface do jogo não encontrada")
                  }

                  val cleanLayer = layer.replace("'", "'\\''")
                  val raw = shizuku.exec(
                      "sh", "-c",
                      "dumpsys SurfaceFlinger --latency '$cleanLayer' 2>/dev/null"
                  ).orEmpty()

                  val timestamps = raw.lineSequence()
                      .drop(1)
                      .mapNotNull { line ->
                          line.trim().split(Regex("\\s+")).getOrNull(1)?.toLongOrNull()
                      }
                      .filter { it > 0L }
                      .toList()
                      .takeLast(120)

                  if (timestamps.size < 3) return FpsSample(null, "Latência indisponível neste aparelho")

                  val deltaNs = timestamps.last() - timestamps.first()
                  if (deltaNs <= 0L) return FpsSample(null, "Amostra inválida")

                  val fps = (timestamps.size - 1) * 1_000_000_000.0 / deltaNs
                  if (fps !in 1.0..500.0) return FpsSample(null, "Amostra fora do intervalo")
                  return FpsSample(fps, "SurfaceFlinger")
              }
          }
          KOTLIN

          cat > "$ROOT/app/src/main/java/com/volt/gamespace/shizuku/ShellUserService.kt" <<'KOTLIN'
          package com.volt.gamespace.shizuku

          import android.content.Context
          import androidx.annotation.Keep
          import java.util.concurrent.TimeUnit
          import kotlin.system.exitProcess

          @Keep
          class ShellUserService() : IShellService.Stub() {
              @Keep constructor(context: Context) : this()

              override fun exec(command: Array<out String>): String {
                  return try {
                      val process = ProcessBuilder(*command).redirectErrorStream(true).start()
                      if (!process.waitFor(6, TimeUnit.SECONDS)) {
                          process.destroyForcibly()
                          return "ERROR: timeout"
                      }
                      process.inputStream.bufferedReader().use { it.readText() }.trim()
                  } catch (t: Throwable) {
                      "ERROR: ${t.javaClass.simpleName}: ${t.message}"
                  }
              }

              override fun destroy() {
                  exitProcess(0)
              }
          }
          KOTLIN

          grep -n "compose-bom" "$ROOT/app/build.gradle.kts"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: /tmp/volt-src/VOLT-Game-Space
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="/tmp/volt-src/VOLT-Game-Space/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/VOLT-Game-Space-v0.3-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOLT-Game-Space-v0.3-debug
          path: VOLT-Game-Space-v0.3-debug.apk
          if-no-files-found: error
