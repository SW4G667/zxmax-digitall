name: VOLT Android APK Build

on:
  push:
    branches:
      - feat/**

jobs:
  build-voltapk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout staged source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore VOLT v0.3 source
        shell: bash
        run: |
          set -euxo pipefail
          cat volt-build-chunks/part_*.b64 > /tmp/volt.tar.gz.b64
          base64 -d /tmp/volt.tar.gz.b64 > /tmp/volt.tar.gz
          mkdir -p /tmp/volt-src
          tar -xzf /tmp/volt.tar.gz -C /tmp/volt-src
          test -f /tmp/volt-src/VOLT-Game-Space/settings.gradle.kts
          test -f /tmp/volt-src/VOLT-Game-Space/app/build.gradle.kts
          sed -i 's/androidx.compose:compose-bom:2026.09.00/androidx.compose:compose-bom:2025.08.00/' /tmp/volt-src/VOLT-Game-Space/app/build.gradle.kts
          grep -n "compose-bom" /tmp/volt-src/VOLT-Game-Space/app/build.gradle.kts

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: /tmp/volt-src/VOLT-Game-Space
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="/tmp/volt-src/VOLT-Game-Space/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/VOLT-Game-Space-v0.3-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOLT-Game-Space-v0.3-debug
          path: VOLT-Game-Space-v0.3-debug.apk
          if-no-files-found: error
