name: Sync Supabase Auth Email Templates

on:
  push:
    branches: [main]
    paths:
      - "auth-email-templates/zxmax-auth-config.json"
      - ".github/workflows/sync-auth-email-templates.yml"
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: szvkktvubyhulzipcxfk

jobs:
  sync-auth-email-templates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN não configurado no GitHub."
            exit 1
          fi

      - name: Apply ZXMAX auth email templates
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/supabase-auth-update.json -w "%{http_code}" \
            -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @auth-email-templates/zxmax-auth-config.json)
          cat /tmp/supabase-auth-update.json | jq '{
            mailer_subjects_confirmation,
            mailer_subjects_recovery,
            mailer_subjects_magic_link,
            mailer_subjects_invite,
            mailer_subjects_email_change,
            mailer_subjects_reauthentication
          }'
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Supabase Management API respondeu HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Templates de autenticação da ZXMAX atualizados sem alterar SMTP."
