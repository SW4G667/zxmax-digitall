name: Promote ZXMAX to Vercel Production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-vercel-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN não está configurado nos GitHub Actions Secrets."
            exit 1
          fi

      - name: Promote validated PIX preview to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest promote zxmax-i4ghkaomf-jnpereiraalves-2390s-projects.vercel.app \
            --yes \
            --token="$VERCEL_TOKEN"
